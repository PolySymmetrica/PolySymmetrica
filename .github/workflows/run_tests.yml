name: Run Tests under OpenSCAD

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    name:    Run Tests
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      # Installs the OpenSCAD development snapshot and supporting tools.
      - name: Install OpenSCAD, docsgen etc
        shell: bash
        run: |
          printf '%s\t%s\n' \
            apt  'sudo apt-get update && sudo apt-get install -y imagemagick xvfb ripgrep' \
            snap 'sudo snap install openscad-nightly' \
            pip  'python3 -m pip install --user openscad-docsgen' |
          parallel --colsep '\t' --line-buffer --halt soon,fail=1 --tagstring '{1}' '{2}'

      - name: Check OpenSCAD version
        run: |
          openscad-nightly --version

          # ensure the SNAP version's PNG generation is "warmed up"
          mkdir -p target/tmp
          printf 'cube(1);\n' > target/tmp/openscad-nightly-warmup.scad
          openscad-nightly -o target/tmp/openscad-nightly-warmup.png target/tmp/openscad-nightly-warmup.scad
          rm -f target/tmp/openscad-nightly-warmup.scad target/tmp/openscad-nightly-warmup.png

      - name: Run unit tests
        run: |
          mkdir -p target/unit-tests
          printf 'cube(1);\n' > target/openscad-nightly-warmup.scad
          openscad-nightly -o target/openscad-nightly-warmup.png target/openscad-nightly-warmup.scad
          rm -f target/openscad-nightly-warmup.scad target/openscad-nightly-warmup.png
          
          openscad-nightly -o target/unit-tests/passed-openscad-nightly.stl src/tests/run_all.scad

      - name: Check API docs build
        run: |
          mkdir -p target/docsgen-check
          ~/.local/bin/openscad-docsgen -q -n -m -r \
            -D target/docsgen-check \
            src/polysymmetrica/core/*.scad \
            src/polysymmetrica/models/*.scad

      - name: Build API preview tree
        run: |
          PATH="$HOME/.local/bin:$PATH" scripts/build_api_reference.sh

      - name: Run visual regressions
        run: |
          mkdir -p target/regression-tests
          LIBGL_ALWAYS_SOFTWARE=1 REGRESSION_JOBS=4 xvfb-run -a --server-args="-screen 0 1280x960x24" \
            src/tests/regression/run_regression.sh diff --tolerance normal

      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-artifacts
          path: target/regression-tests

      - name: Ensure examples build correctly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/examples
          examples=(src/polysymmetrica/examples/{basics,truncation}/main_*.scad)
          printf '%s\n' "${examples[@]}" | parallel \
            --will-cite \
            --halt soon,fail=1 \
            --jobs "${EXAMPLE_JOBS:-4}" \
            --line-buffer \
            --tagstring '{/.}' \
            --joblog target/examples/examples.joblog \
            'echo "Executing {} at $(date)"; openscad-nightly -o target/examples/{/.}.stl {}'

      - name: Upload example artifacts (enable on failure)
        if: false
        uses: actions/upload-artifact@v6
        with:
          name: visual-example-artifacts
          path: target/examples
